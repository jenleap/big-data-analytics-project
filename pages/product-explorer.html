<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Plotly for Sankey -->
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

    <!-- vis-network for Graph -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <!-- D3 for Venn (unused here but kept) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/venn.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: #fafafa;
        }

        h2 {
            margin-bottom: 0.5rem;
        }

        select,
        button {
            margin: 0.5rem 0;
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
        }

        #controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hidden {
            display: none !important;
        }

        /* Header row under product table: left = product name, right = view toggles */
        #product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        #view-toggle i {
            cursor: pointer;
            margin-left: 0.5rem;
            font-size: 1.4rem;
        }

        #view-toggle i.active {
            color: #007bff;
        }

        /* Chart container layout */
        #chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* center charts horizontally */
            width: 100%;
            min-height: 600px;
            margin-top: 1rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 1rem;
            box-sizing: border-box;
            overflow: auto;
            justify-content: flex-start;
        }

        /* Individual chart boxes */
        #comps,
        #subs,
        /* keep venn if used later */
        #venn {
            width: 90%;
            max-width: 1200px;
            height: 420px;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            background: white;
        }

        /* Make sure Plotly uses full size of the div */
        #comps>.vis-network,
        #comps>canvas,
        #subs>.js-plotly-plot,
        #subs>.plotly {
            width: 100% !important;
            height: 100% !important;
        }

        /* Table container styling */
        #table-container {
            margin-top: 1rem;
            width: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1rem;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .clickable {
            color: #0a66c2;
            cursor: pointer;
            text-decoration: underline;
        }

        .chart-block {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .chart-block h3 {
            margin-bottom: 0.5rem;
        }

        .chart {
            width: 100%;
            height: 400px;
        }
    </style>
</head>

<body>
    <h2>Product Explorer</h2>

    <div id="controls">
        <div id="product-table-container"></div>
    </div>

    <!-- Product details header + view toggle (hidden until product selected) -->
    <div id="product-header" class="hidden">
        <h2 id="selected-product-name" style="margin: 0;"></h2>

        <div id="view-toggle" class="hidden" aria-hidden="true" role="toolbar" title="Toggle view">
            <i id="table-icon" class="fas fa-table" title="Table view"></i>
            <i id="chart-icon" class="fas fa-chart-bar" title="Chart view"></i>
        </div>
    </div>

    <!-- Container for charts -->
    <div id="chart-container" class="hidden">
        <div class="chart-block">
            <div class="chart-block">
                <h3>Substitutes</h3>
                <div id="subs" class="chart"></div>
            </div>
            <h3>Complements</h3>
            <div id="comps" class="chart"></div>
        </div>
    </div>

    <!-- Container for tables -->
    <div id="table-container" class="hidden">
        <h3>Substitutes</h3>
        <div id="subs-table"></div>

        <h3>Complements</h3>
        <div id="comps-table"></div>
    </div>

    <script>
        // Globals to manage chart instances and last selected product
        let products;
        let currentVisNetwork = null;
        let lastRenderedProductId = null;

        async function loadJSON(file) {
            const response = await fetch(file);
            return await response.json();
        }

        async function init() {
            [products] = await Promise.all([
                loadJSON('../json/focus-products.json')
            ]);

            // wire up toggles
            const tableIcon = document.getElementById('table-icon');
            const chartIcon = document.getElementById('chart-icon');
            const tableContainer = document.getElementById('table-container');
            const chartContainer = document.getElementById('chart-container');

            // click handlers for toggles
            tableIcon.addEventListener('click', () => {
                // highlight active icon
                tableIcon.classList.add('active');
                chartIcon.classList.remove('active');

                // show table, hide charts
                tableContainer.classList.remove('hidden');
                chartContainer.classList.add('hidden');

                // purge charts so they don't visually leak
                purgeCharts();
            });

            chartIcon.addEventListener('click', () => {
                // highlight active icon
                chartIcon.classList.add('active');
                tableIcon.classList.remove('active');

                // show charts, hide table
                tableContainer.classList.add('hidden');
                chartContainer.classList.remove('hidden');

                // lazy-render charts for currently selected product
                const prodName = document.getElementById('selected-product-name').textContent;
                if (prodName) {
                    const prodId = Object.keys(products).find(id => products[id].name === prodName);
                    if (prodId) {
                        // only re-render if different product or nothing rendered yet
                        if (lastRenderedProductId !== prodId) {
                            renderChart(prodId);
                        }
                    }
                }
            });

            populateProductsTable();
        }

        function populateProductsTable() {
            const container = document.getElementById('product-table-container');
            container.innerHTML = ''; // clear any existing table

            // Create table
            const table = document.createElement('table');

            // Table header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['Product', 'Value 1', 'Value 2', 'Value 3'].forEach(text => {
                const th = document.createElement('th');
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Table body
            const tbody = document.createElement('tbody');
            for (const prodId of Object.keys(products)) {
                const prod = products[prodId];
                const tr = document.createElement('tr');

                // Product name (clickable)
                const tdName = document.createElement('td');
                tdName.textContent = prod.name;
                tdName.classList.add('clickable');
                tdName.addEventListener('click', () => {
                    // set header name (replace, do not append)
                    document.getElementById("selected-product-name").textContent = prod.name;

                    // show header & toggles
                    document.getElementById("product-header").classList.remove("hidden");
                    document.getElementById("view-toggle").classList.remove("hidden");

                    // default to table view when selecting a product
                    document.getElementById("table-container").classList.remove("hidden");
                    document.getElementById("chart-container").classList.add("hidden");

                    // set active icon
                    document.getElementById('table-icon').classList.add('active');
                    document.getElementById('chart-icon').classList.remove('active');

                    // render content
                    renderTables(prodId);

                    // purge any previously rendered charts (so they won't show while table is visible)
                    purgeCharts();

                    // remember that charts are not rendered for this product yet
                    lastRenderedProductId = null;
                });

                tr.appendChild(tdName);

                // Values columns
                for (let i = 0; i < 3; i++) {
                    const td = document.createElement('td');
                    td.textContent = prod.values?.[i] ?? '';
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            }

            table.appendChild(tbody);
            container.appendChild(table);
        }

        // Generic table renderer
        function renderGenericTable(containerId, rows, columns) {
            const container = document.getElementById(containerId);
            container.innerHTML = ""; // Clear previous table

            const table = document.createElement("table");

            // Header
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            columns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col.label;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Body
            const tbody = document.createElement("tbody");
            rows.forEach(row => {
                const tr = document.createElement("tr");
                columns.forEach(col => {
                    const td = document.createElement("td");
                    td.textContent = row[col.key] ?? "";
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            container.appendChild(table);
        }

        // renderTables populates the two tables
        function renderTables(productId) {
            const product = products[productId];

            // Build rows for substitutes
            const subsRows = (product.subs || []).map(s => ({
                name: s.name,
                score: s.values?.[1] ?? "",
                extra1: s.values?.[0] ?? "",
                extra2: s.values?.[2] ?? ""
            }));

            // Build rows for complements
            const compsRows = (product.comps || []).map(c => ({
                name: c.name,
                score: c.values?.[1] ?? "",
                extra1: c.values?.[0] ?? "",
                extra2: c.values?.[2] ?? ""
            }));

            const columns = [
                { key: "name", label: "Name" },
                { key: "score", label: "Score" },
                { key: "extra1", label: "Value 1" },
                { key: "extra2", label: "Value 2" }
            ];

            renderGenericTable("subs-table", subsRows, columns);
            renderGenericTable("comps-table", compsRows, columns);
        }

        // Purge/clear the chart container children and destroy vis instance if present
        function purgeCharts() {
            // Sankey (Plotly)
            const subDiv = document.querySelector('#chart-container #subs');
            if (subDiv) {
                try { Plotly.purge(subDiv); } catch (e) { /* ignore */ }
                subDiv.innerHTML = '';
            }

            // Network (vis)
            const compDiv = document.querySelector('#chart-container #comps');
            if (compDiv) {
                if (currentVisNetwork && typeof currentVisNetwork.destroy === 'function') {
                    try { currentVisNetwork.destroy(); } catch (e) { /* ignore */ }
                    currentVisNetwork = null;
                }
                compDiv.innerHTML = '';
            }

            // mark last rendered product cleared
            lastRenderedProductId = null;
        }

        // Render both charts for a product (Sankey + Network)
        function renderChart(productId) {
            if (!productId) return;
            // ensure charts render into the chart-container children
            renderSankey(productId);
            renderNetwork(productId);
            lastRenderedProductId = productId;
        }

        // Sankey: render into #chart-container #subs
        function renderSankey(productId) {
            const subDiv = document.querySelector('#chart-container #subs');
            if (!subDiv) return;

            // clear previous
            try { Plotly.purge(subDiv); } catch (e) { /* ignore */ }
            subDiv.innerHTML = '';

            const product = products[productId];
            const productName = product.name;
            const subs = product.subs || [];
            const substituteNames = subs.map(s => s.name);
            const labels = [productName, ...substituteNames];
            const sources = subs.map(() => 0);
            const targets = subs.map((_, i) => i + 1);
            const values = subs.map(s => Math.round((s.values?.[1] ?? 0) * 1000) / 10);

            const data = [{
                type: 'sankey',
                orientation: 'h',
                node: {
                    pad: 15,
                    thickness: 20,
                    line: { color: 'black', width: 0.5 },
                    label: labels,
                    customdata: values
                },
                link: {
                    source: sources,
                    target: targets,
                    value: values
                }
            }];

            const layout = {
                title: productName,
                autosize: true,
                margin: { t: 50, l: 50, r: 50, b: 50 },
            };

            Plotly.newPlot(subDiv, data, layout, { responsive: true });
        }

        // Network: render into #chart-container #comps
        function renderNetwork(productId) {
            const compDiv = document.querySelector('#chart-container #comps');
            if (!compDiv) return;

            // destroy any existing network and clear
            if (currentVisNetwork && typeof currentVisNetwork.destroy === 'function') {
                try { currentVisNetwork.destroy(); } catch (e) { /* ignore */ }
                currentVisNetwork = null;
            }
            compDiv.innerHTML = '';

            const product = products[productId];
            const comps = product.comps || [];

            // Build nodes map and edges
            const nodesMap = {};
            nodesMap[productId] = {
                id: String(productId),
                label: String(product.name || productId),
                color: '#1f77b4'
            };

            const n = comps.length;
            const radius = Math.max(120, Math.min(260, n * 25)); // heuristic
            const centerX = 0, centerY = 0;

            comps.forEach((c, index) => {
                const angle = (2 * Math.PI / Math.max(1, n)) * index;
                const nodeId = String(c.id ?? c.name); // fallback to name as id if no id
                if (!nodesMap[nodeId]) {
                    nodesMap[nodeId] = {
                        id: nodeId,
                        label: c.name,
                        color: '#2ca02c',
                        x: centerX + radius * Math.cos(angle),
                        y: centerY + radius * Math.sin(angle),
                        fixed: true
                    };
                }
            });

            const nodes = Object.values(nodesMap);
            const edges = comps.map(c => ({
                from: String(productId),
                to: String(c.id ?? c.name),
                value: c.values?.[1] ?? 0
            }));

            const data = { nodes, edges };

            const options = {
                nodes: {
                    shape: 'dot',
                    size: 12,
                    font: { size: 14, color: '#000000', face: 'Arial' }
                },
                edges: { arrows: 'to', smooth: true },
                physics: { enabled: true },
                layout: { hierarchical: false }
            };

            // Create and keep reference
            currentVisNetwork = new vis.Network(compDiv, data, options);
        }

        // Venn helpers kept (unused unless you decide to show venn)
        function addListText(selection, items) {
            selection.selectAll("*").remove();
            const textElem = selection.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "-0.5em");

            items.forEach((item, i) => {
                textElem.append("tspan")
                    .attr("x", 0)
                    .attr("dy", i === 0 ? "0em" : "1.2em")
                    .text(item);
            });
        }

        function getVennData(productId) {
            const product = products[productId];

            const productComps = new Set((product.comps || []).map(c => c.name));
            const subsComps = new Set();
            for (const sub of (product.subs || [])) {
                if (products[sub?.id]) {
                    products[sub.id].comps.forEach(c => subsComps.add(c.name));
                } else if (sub.comps) {
                    sub.comps.forEach(c => subsComps.add(c.name));
                }
            }

            return { productComps, subsComps };
        }

        function renderVenn(productId) {
            // kept for later if wanted
            const { productComps, subsComps } = getVennData(productId);
            const prodArray = [...productComps];
            const subsArray = [...subsComps];
            const intersection = prodArray.filter(x => subsComps.has(x));

            const sets = [
                { sets: ['Product'], size: prodArray.length },
                { sets: ['Subs'], size: subsArray.length },
                { sets: ['Product', 'Subs'], size: intersection.length }
            ];

            const vennDiv = document.getElementById('venn');
            if (vennDiv) vennDiv.innerHTML = '';

            const chart = venn.VennDiagram().width(400).height(400);
            const div = d3.select("#venn").datum(sets).call(chart);

            div.selectAll("g").each(function (d) {
                const g = d3.select(this);
                if (d.sets.length === 1) {
                    if (d.sets[0] === 'Product') addListText(g, prodArray);
                    if (d.sets[0] === 'Subs') addListText(g, subsArray);
                } else if (d.sets.length === 2) {
                    addListText(g, intersection);
                }
            });
        }

        // start
        init();
    </script>
</body>

</html>
