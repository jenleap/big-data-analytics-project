<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Substitute Visualization</title>

  <!-- Plotly for Sankey -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <!-- vis-network for Graph -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #fafafa;
    }
    h2 { margin-bottom: 0.5rem; }
    select, button {
      margin: 0.5rem 0;
      padding: 0.4rem 0.6rem;
      font-size: 1rem;
    }
    #chart {
      width: 100%;
      height: 600px;
      margin-top: 2rem;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    #controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <h2>Product Substitution Explorer</h2>

  <div id="controls">
    <div>
      <label for="dept">Department:</label><br />
      <select id="dept">
        <option value="">Select Department</option>
      </select>
    </div>

    <div>
      <label for="aisle">Aisle:</label><br />
      <select id="aisle" disabled>
        <option value="">Select Aisle</option>
      </select>
    </div>

    <div>
      <label for="product">Product:</label><br />
      <select id="product" disabled>
        <option value="">Select Product</option>
      </select>
    </div>

    <div>
      <label>Chart Type:</label><br />
      <button id="toggleChart">Sankey</button>
    </div>
  </div>

  <div id="chart"></div>

  <script>
    let departments, aisles, products, substitutes;
    let currentChart = 'sankey'; // default chart type

    async function loadJSON(file) {
      const response = await fetch(file);
      return await response.json();
    }

    async function init() {
      [departments, aisles, products, substitutes] = await Promise.all([
        loadJSON('../json/sample-departments.json'),
        loadJSON('../json/sample-aisles.json'),
        loadJSON('../json/sample-products.json'),
        loadJSON('../json/product_true_substitutes.json')
      ]);
      populateDepartments();
    }

    function populateDepartments() {
      const deptSelect = document.getElementById('dept');
      for (const dept of departments) {
        const opt = document.createElement('option');
        opt.value = dept.department_id;
        opt.textContent = dept.department;
        deptSelect.appendChild(opt);
      }
      deptSelect.addEventListener('change', onDeptChange);
    }

    function onDeptChange() {
      const deptId = parseInt(this.value);
      const aisleSelect = document.getElementById('aisle');
      aisleSelect.innerHTML = '<option value="">Select Aisle</option>';
      document.getElementById('product').innerHTML = '<option value="">Select Product</option>';
      document.getElementById('product').disabled = true;

      if (!deptId) {
        aisleSelect.disabled = true;
        return;
      }
      const dept = departments.find(d => d.department_id === deptId);
      for (const aisle of dept.aisles) {
        const opt = document.createElement('option');
        opt.value = aisle.aisle_id;
        opt.textContent = aisle.aisle;
        aisleSelect.appendChild(opt);
      }
      aisleSelect.disabled = false;
      aisleSelect.addEventListener('change', onAisleChange);
    }

    function onAisleChange() {
      const aisleId = parseInt(this.value);
      const productSelect = document.getElementById('product');
      productSelect.innerHTML = '<option value="">Select Product</option>';

      if (!aisleId) {
        productSelect.disabled = true;
        return;
      }
      const aisleObj = aisles.find(a => a.aisle_id === aisleId);
      for (const prod of aisleObj.products) {
        const opt = document.createElement('option');
        opt.value = prod.product_id;
        opt.textContent = prod.product_name;
        productSelect.appendChild(opt);
      }
      productSelect.disabled = false;
      productSelect.addEventListener('change', onProductChange);
    }

    function onProductChange() {
      const productId = this.value;
      if (!productId) return;
      const subs = substitutes[productId];
      if (!subs) {
        alert('No substitutes found for this product.');
        return;
      }
      renderChart(productId, subs);
    }

    function renderChart(productId, subs) {
      const productName = products[productId];
      const substituteNames = subs.map(s => products[s.product_id]);

      const chartDiv = document.getElementById('chart');
      chartDiv.innerHTML = '';

      if (currentChart === 'sankey') {
        renderSankey(chartDiv, productName, substituteNames, subs);
      } else {
        renderNetwork(chartDiv, productName, substituteNames, subs);
      }
    }

    function renderSankey(container, productName, substituteNames, subs) {
      const labels = [productName, ...substituteNames];
      const sources = subs.map(() => 0);
      const targets = subs.map((_, i) => i + 1);
      const values = subs.map(s => Math.round(s.score * 1000)/10);

      const data = [{
        type: 'sankey',
        orientation: 'h',
        node: {
          pad: 15,
          thickness: 20,
          line: { color: 'black', width: 0.5 },
          label: labels,
          hovertemplate: "%{label}<br>Total score: %{customdata}<extra></extra>",
          customdata: values
        },
        link: {
          source: sources,
          target: targets,
          value: values,
          hovertemplate: "%{source.label} → %{target.label}<br>Score: %{value}<extra></extra>"
        }
      }];

      Plotly.newPlot(container, data, { title: productName });
    }

     function renderNetwork(container, productId,substituteNames, subs) {
        const centerX = 0; // main node X
        const centerY = 0; // main node Y
        const radius = 200; // distance from the center
        const n = subs.length;
        // Build unique nodes
        const nodesMap = {};
        nodesMap[productId] = { 
            id: String(productId), 
            label: String(products[productId] || productId), 
            color: '#1f77b4' 
        };

        subs.forEach((s, index) => {
            const angle = (2 * Math.PI / n) * index; // evenly spaced around circle
            const nodeId = String(s.product_id);

            if (!nodesMap[nodeId]) {
                const offset = (index%2 == 0) ? 10 : 0;
                nodesMap[nodeId] = {
                    id: nodeId,
                    label: String(products[s.product_id] || s.product_id),
                    color: '#2ca02c',
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle),
                    fixed: true
                };
            }
        });

        const nodes = Object.values(nodesMap);

        // Create edges
        const edges = subs.map(s => ({
            from: String(productId),
            to: String(s.product_id),
            value: s.score
        }));

        const data = { nodes, edges };

        const options = {
            nodes: { 
                shape: 'dot', 
                size: 12, 
                font: { size: 14, color: '#000000', face: 'Arial' } 
            },
            edges: { arrows: 'to', smooth: true },
            physics: {
                enabled: false
            },
            layout: {
                hierarchical: false
            }
        };

        new vis.Network(container, data, options);
    } 

    document.getElementById('toggleChart').addEventListener('click', () => {
      currentChart = currentChart === 'sankey' ? 'network' : 'sankey';
      document.getElementById('toggleChart').textContent =
        currentChart.charAt(0).toUpperCase() + currentChart.slice(1);
      const productId = document.getElementById('product').value;
      if (productId) onProductChange.call(document.getElementById('product'));
    });

    init();
  </script>
</body>
</html>
